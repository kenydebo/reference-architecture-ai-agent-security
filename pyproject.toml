[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-security-reference-architecture"
version = "1.0.0"
description = "Reference implementation of security controls for enterprise AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0,<50.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools]
packages = ["agents", "assurance", "forensics", "gateway", "scenarios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
